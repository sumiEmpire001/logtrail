[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-sumi-logtrail"
version = "0.1.0"
description = "Filter and summarize JSONL event logs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Lord_Sumi"}]

[project.scripts]
logtrail = "logtrail:main"

[tool.setuptools]
py-modules = ["logtrail"]
